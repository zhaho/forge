---
# Dedicated k3s-cluster playbook (not component-based). Forge assigns node 1 in
# the deployment to the [k3s_control_plane] group and the rest to [k3s_workers]
# in the generated inventory.

- name: Install k3s control-plane
  hosts: k3s_control_plane
  become: true
  tasks:
    - name: Install k3s server
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token to exist
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw

    - name: Expose token and control-plane IP to other hosts
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_raw.content | b64decode | trim }}"
        k3s_control_plane_ip: "{{ ansible_default_ipv4.address }}"

- name: Install k3s workers
  hosts: k3s_workers
  become: true
  vars:
    k3s_url: "https://{{ hostvars[groups['k3s_control_plane'][0]]['k3s_control_plane_ip'] }}:6443"
    k3s_token: "{{ hostvars[groups['k3s_control_plane'][0]]['k3s_token'] }}"
  tasks:
    - name: Install k3s agent and join the cluster
      ansible.builtin.shell: "curl -sfL https://get.k3s.io | K3S_URL={{ k3s_url }} K3S_TOKEN={{ k3s_token }} sh -"
      args:
        creates: /usr/local/bin/k3s-agent
