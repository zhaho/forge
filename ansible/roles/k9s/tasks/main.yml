---
- name: "k9s | map architecture to k9s release naming"
  set_fact:
    k9s_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'arm'}[ansible_architecture] | default('amd64') }}"

- name: "k9s | check if k9s is already installed"
  ansible.builtin.stat:
    path: /usr/local/bin/k9s
  register: k9s_binary

- name: "k9s | download the k9s release archive"
  ansible.builtin.command:
    cmd: "curl -fsSL https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_{{ k9s_arch }}.tar.gz -o /tmp/k9s.tar.gz"
    creates: /tmp/k9s.tar.gz
  when: not k9s_binary.stat.exists

- name: "k9s | extract the k9s binary"
  ansible.builtin.unarchive:
    src: /tmp/k9s.tar.gz
    dest: /tmp
    remote_src: true
    include:
      - k9s
  when: not k9s_binary.stat.exists

- name: "k9s | install the k9s binary"
  ansible.builtin.copy:
    src: /tmp/k9s
    dest: /usr/local/bin/k9s
    mode: "0755"
    remote_src: true
  when: not k9s_binary.stat.exists
