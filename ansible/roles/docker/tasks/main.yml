---
- name: "docker | map architecture to Docker's apt naming"
  set_fact:
    docker_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}[ansible_architecture] | default('amd64') }}"

- name: "docker | install prerequisite packages"
  package:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: "docker | create apt keyrings directory"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: "docker | download Docker's official GPG key"
  ansible.builtin.command:
    cmd: "curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg -o /etc/apt/keyrings/docker.asc"
    creates: /etc/apt/keyrings/docker.asc

- name: "docker | ensure GPG key has correct permissions"
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: "docker | add Docker apt repository"
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  register: docker_repo_added

- name: "docker | refresh apt cache after adding repo"
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo_added.changed

- name: "docker | install docker engine, cli and compose plugin"
  package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: "docker | start and enable docker service"
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: "docker | add deploy user to the docker group"
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
